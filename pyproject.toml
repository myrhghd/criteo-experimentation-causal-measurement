[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criteo-experimentation-causal-measurement"
version = "0.1.0"
description = "Experimentation and causal measurement using the Criteo uplift dataset."
requires-python = ">=3.11,<3.12"

[project.scripts]
criteo-data = "criteo_experiment.dataset:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
